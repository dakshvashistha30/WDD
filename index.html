<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game!</title>
</head>
<body>
    <h1>Number Guessing Game</h1>
    <p>Guess a number between 1 and 10</p> 
    <input type="number" id="guess" placeholder="Enter your guess"> 
    <button onclick="checkGuess()">Guess</button> <p id="result"></p>
    <p id="result"></p>
    <script>
    let random = Math.floor(Math.random() * 10) + 1;
    function checkGuess(){
        let userGuess = Number(document.getElementById("guess").value);

        if (userGuess == random)
            {document.getElementById("result").innerHTML = "Correct! You guessed the number"}
            if (userGuess < random)
            {document.getElementById("result").innerHTML = "Too Less ! You guessed the wrong number"}
            if (userGuess > random)
            {document.getElementById("result").innerHTML = "Too High! You guessed the wrong number"}
            }

    </script>
</body>
</html>

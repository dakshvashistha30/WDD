<!DOCTYPE html>
<html>
</head>
<body>
    <h1>Student Registeration Form</h1>
    <hr>
    <form action ="#" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        <br><br>

        <label for ="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder=" example@email.com" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="6" required>
        <br><br>

        <label for="dob">Date Of Birth:</label>
        <input type="data" id="dob" name="dob" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name = "gender" value = "other">
        <label for="other">Other</label>
        <br><br>

        <label for="course">Course:</label>
        <select id="course" name="Course" required>
            <option value="">---Select Option---</option>
            <option>BCA</option>
            <option>BTECH</option>
            <option>BSC</option>
            <option>MTECH</option>
            <option>MSC</option>
        </select>
        <br><br>

        <label>Skills:</label>
        <input type="checkbox" id="html" name = "skills" value="HTML">
        <label for="html">HTML</label>
        <input type="checkbox" id="js" name="skills" value="HTML">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>
        <input type="checkbox" id="js"name="skills" value="JavaScript">
        <label for = "js">JavaScript</label>
        <input type="checkbox" id="css" name ="skills" value="python">
        <label for="python">Python</label>
        <br><br>
        
        <label for="Address">Address</label>
        <textarea id="Address" name="Address" rows="4" cols="40" placeholder="Enter your Address"></textarea>
        <br><br>

        <label for="Photo">Upload Photo</label>
        <input type="file" id="photo" name="photo" accept="image/*">
        <br><br>

        <label for="website">Personal Website:</label>
        <input type="url" id="website"name="website" placeholder="https://example.com">
        <br><br>

        <label for="favcolor">Favourite Color:</label>
        <input type="color" id="favcolor" name="favcolor">
        <br><br>

        <label for="admission">Admission Month:</label>
        <input typ="month" id="admission" name="admission">
        <br><br>

        <label for="studytime">Preferred Study Time:</label>
        <input type="time" id="studytime" name="studytime">
        <br><br>

        <input type="checkbox" id="agree" required>
        <label for="agree">I agree to the terms and conditions</label>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">
    </form>
</body>
</html>
